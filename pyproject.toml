[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchid-rag-qdrant"
version = "0.0.0"
description = "Qdrant vector and doc-store backend for the Orchid AI framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Orchid Team" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "orchid-ai>=1.8.2",
    "qdrant-client>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0",
    "ruff>=0.9.0",
]

[project.entry-points."orchid.vector_backends"]
qdrant = "orchid_rag_qdrant:_register"

[project.entry-points."orchid.doc_store_backends"]
qdrant = "orchid_rag_qdrant:_register"
